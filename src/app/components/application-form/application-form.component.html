<mat-card>
    <mat-card-header>
      <mat-card-title>{{application ? 'Edit' : 'Add'}} Application</mat-card-title>
    </mat-card-header>
    
    <mat-card-content>
      <form [formGroup]="applicationForm" (ngSubmit)="onSubmit()">
        <mat-form-field appearance="fill">
          <mat-label>Company Name</mat-label>
          <input matInput formControlName="companyName" required>
          <mat-error *ngIf="applicationForm.get('companyName')?.hasError('required')">
            Company name is required
          </mat-error>
        </mat-form-field>
  
        <mat-form-field appearance="fill">
          <mat-label>Role</mat-label>
          <input matInput formControlName="role" required>
          <mat-error *ngIf="applicationForm.get('role')?.hasError('required')">
            Role is required
          </mat-error>
        </mat-form-field>
  
        <mat-form-field appearance="fill">
          <mat-label>Job Description URL</mat-label>
          <input matInput formControlName="jdUrl" required>
          <mat-error *ngIf="applicationForm.get('jdUrl')?.hasError('required')">
            URL is required
          </mat-error>
          <mat-error *ngIf="applicationForm.get('jdUrl')?.hasError('pattern')">
            Please enter a valid URL
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="fill">
          <mat-label>Job Description Text</mat-label>
          <textarea matInput formControlName="jdText" rows="4" placeholder="Paste or write job description here"></textarea>
        </mat-form-field>
  
        <mat-form-field appearance="fill">
          <mat-label>Application Date</mat-label>
          <input matInput [matDatepicker]="picker" formControlName="dateApplied" required>
          <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
          <mat-datepicker #picker></mat-datepicker>
        </mat-form-field>
  
        <mat-form-field appearance="fill">
          <mat-label>Status</mat-label>
          <mat-select formControlName="status" required>
            <mat-option *ngFor="let status of statusOptions" [value]="status">
              {{status}}
            </mat-option>
          </mat-select>
        </mat-form-field>
  
        <mat-form-field appearance="fill">
          <mat-label>Notes</mat-label>
          <textarea matInput formControlName="notes" rows="3"></textarea>
        </mat-form-field>
  
        <div class="form-actions">
          <button mat-raised-button color="primary" type="submit">
            {{application ? 'Update' : 'Save'}}
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
