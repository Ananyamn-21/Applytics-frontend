<div class="dashboard-container">
    <mat-grid-list cols="2" rowHeight="350px" gutterSize="16px">
      <!-- Stats Overview -->
      <mat-grid-tile>
        <mat-card class="stats-card">
          <mat-card-header>
            <mat-card-title>Applications Overview</mat-card-title>
          </mat-card-header>
          <mat-card-content>
            <div class="stat-item">
              <h3>Total Applications</h3>
              <span class="stat-value">{{stats.total}}</span>
            </div>
            
            <div class="stat-item">
              <h3>Applied</h3>
              <span class="stat-value">{{stats.applied}}</span>
            </div>
            
            <div class="stat-item">
              <h3>Interview Scheduled</h3>
              <span class="stat-value">{{stats.interview}}</span>
            </div>
            
            <div class="stat-item">
              <h3>Rejected</h3>
              <span class="stat-value">{{stats.rejected}}</span>
            </div>
            
            <div class="stat-item">
              <h3>Selected</h3>
              <span class="stat-value">{{stats.selected}}</span>
            </div>
            
            
          </mat-card-content>
        </mat-card>
      </mat-grid-tile>
      
      <!-- Chart -->
      <mat-grid-tile>
        <mat-card class="chart-card">
          <mat-card-header>
            <mat-card-title>Application Status Distribution</mat-card-title>
          </mat-card-header>
          <mat-card-content>
            <p-chart type="pie" [data]="chartData" [options]="chartOptions"></p-chart>
          </mat-card-content>
        </mat-card>
      </mat-grid-tile>
    </mat-grid-list>
  </div>
