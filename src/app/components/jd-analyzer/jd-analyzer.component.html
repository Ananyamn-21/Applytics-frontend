<mat-card>
    <mat-card-header>
      <mat-card-title>Job Description Analyzer</mat-card-title>
      <mat-card-subtitle>Extract key skills from job descriptions</mat-card-subtitle>
    </mat-card-header>
  
    <mat-card-content>
      <mat-form-field appearance="fill" class="full-width">
        <mat-label>Paste Job Description Here</mat-label>
        <textarea matInput [(ngModel)]="jdText" rows="8"></textarea>
      </mat-form-field>
  
      <div class="button-row">
        <button mat-raised-button color="primary" (click)="analyzeJD()" [disabled]="!jdText || isLoading">
          Analyze
          <mat-icon *ngIf="isLoading">
            <mat-spinner diameter="20"></mat-spinner>
          </mat-icon>
        </button>
        <button mat-button (click)="clearAnalysis()">Clear</button>
      </div>
  
      <mat-divider *ngIf="extractedSkills.length > 0"></mat-divider>
  
      <div *ngIf="extractedSkills.length > 0" class="skills-section">
        <h3>Extracted Skills:</h3>
        <mat-chip-listbox>
          <mat-chip *ngFor="let skill of extractedSkills">
            {{ skill.name }}
          </mat-chip>
        </mat-chip-listbox>
      </div>
    </mat-card-content>
  </mat-card>
