<mat-card>
    <mat-card-header>
      <mat-card-title>Preparation Resources: {{skillName}}</mat-card-title>
      <mat-card-subtitle>Curated learning materials for this skill</mat-card-subtitle>
    </mat-card-header>
  
    <mat-card-content>
      <div class="preparation-status">
        <mat-checkbox [(ngModel)]="isPrepared" (change)="togglePreparation()">
          Mark as prepared
        </mat-checkbox>
        
        <mat-form-field appearance="fill" class="notes-field">
          <mat-label>Personal Notes</mat-label>
          <textarea matInput [(ngModel)]="notes" 
                    (blur)="savePreparationStatus()"
                    rows="2"></textarea>
        </mat-form-field>
      </div>
  
      <mat-divider></mat-divider>
  
      <h3>Recommended Resources</h3>
      
      <mat-list>
        <mat-list-item *ngFor="let resource of resources">
          <mat-icon matListItemIcon>{{getResourceIcon(resource.type)}}</mat-icon>
          <div matListItemTitle>{{resource.title}}</div>
          <div matListItemLine class="resource-url">{{resource.url}}</div>
          
          <button mat-icon-button (click)="openResource(resource.url)">
            <mat-icon>open_in_new</mat-icon>
          </button>
        </mat-list-item>
      </mat-list>
  
      <mat-divider></mat-divider>
  
      <h3>Add New Resource</h3>
      
      <div class="add-resource-form">
        <mat-form-field appearance="fill">
          <mat-label>Resource Title</mat-label>
          <input matInput [(ngModel)]="newResourceTitle">
        </mat-form-field>
        
        <mat-form-field appearance="fill">
          <mat-label>Resource URL</mat-label>
          <input matInput [(ngModel)]="newResourceUrl" placeholder="https://">
        </mat-form-field>
        
        <button mat-raised-button color="primary" 
                (click)="addResource()"
                [disabled]="!newResourceTitle || !newResourceUrl">
          Add Resource
        </button>
      </div>
    </mat-card-content>
  </mat-card>
