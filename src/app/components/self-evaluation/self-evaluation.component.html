<mat-card>
    <mat-card-header>
      <mat-card-title>Interview Self-Evaluation</mat-card-title>
      <mat-card-subtitle>Log your interview experience and performance</mat-card-subtitle>
    </mat-card-header>
  
    <mat-card-content>
      <form [formGroup]="evaluationForm" (ngSubmit)="onSubmit()">
        <div class="form-row">
          <mat-form-field appearance="fill">
            <mat-label>Company</mat-label>
            <input matInput formControlName="company" required>
          </mat-form-field>
  
          <mat-form-field appearance="fill">
            <mat-label>Role</mat-label>
            <input matInput formControlName="role" required>
          </mat-form-field>
        </div>
  
        <mat-form-field appearance="fill">
          <mat-label>Interview Date</mat-label>
          <input matInput [matDatepicker]="picker" formControlName="interviewDate" required>
          <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
          <mat-datepicker #picker></mat-datepicker>
        </mat-form-field>
  
        <mat-form-field appearance="fill" class="full-width">
          <mat-label>Questions Asked</mat-label>
          <textarea matInput formControlName="questions" rows="4" required></textarea>
        </mat-form-field>
  
        <mat-form-field appearance="fill" class="full-width">
          <mat-label>Concepts You Missed</mat-label>
          <textarea matInput formControlName="conceptsMissed" rows="2"></textarea>
        </mat-form-field>
  
        <div class="form-section">
          <h3>Interview Difficulty</h3>
          <mat-radio-group formControlName="difficulty">
            <mat-radio-button *ngFor="let level of difficultyOptions" [value]="level">
              {{level}}
            </mat-radio-button>
          </mat-radio-group>
        </div>
  
        <div class="form-section">
          <h3>Preparation Score (1-5)</h3>
          <mat-slider
            formControlName="preparationScore"
            min="1"
            max="5"
            step="1"
            thumbLabel
            tickInterval="1">
          </mat-slider>
        </div>
  
        <mat-form-field appearance="fill" class="full-width">
          <mat-label>Notes</mat-label>
          <textarea matInput formControlName="notes" rows="3"></textarea>
        </mat-form-field>
  
        <div class="form-actions">
          <button mat-raised-button color="primary" type="submit">Save Evaluation</button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
