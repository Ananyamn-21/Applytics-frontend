<mat-card>
    <mat-card-header>
      <mat-card-title>Skill Preparation Tracker</mat-card-title>
      <mat-card-subtitle>Track your technical skill preparation</mat-card-subtitle>
    </mat-card-header>
  
    <mat-card-content>
      <div class="jobs-grid">
        <mat-card *ngFor="let job of jobs" class="job-card">
          <mat-card-header>
            <mat-card-title>{{job.companyName}}</mat-card-title>
            <mat-card-subtitle>{{job.role}}</mat-card-subtitle>
          </mat-card-header>
          <mat-card-content>
            <div>Date Applied: {{job.dateApplied | date}}</div>
            <div>Status: <mat-chip [color]="getStatusColor(job.status)" selected>{{job.status}}</mat-chip></div>
          </mat-card-content>
          <mat-card-actions>
            <button mat-button color="primary" (click)="goToSkillPreparation(job.id)">Open Skills</button>
          </mat-card-actions>
        </mat-card>
      </div>
    </mat-card-content>
  </mat-card>
